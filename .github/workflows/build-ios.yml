name: Build iOS IPA (unsigned)

# Builds the Ninja Legends iPhone app from Pomu1144/NXBNVNB (its Capacitor project in app/ios) on a free
# GitHub macOS runner, in two versions, and publishes both as the "latest" release:
#   NinjaLegends-live.ipa      about 300 MB: the game's pages and art come from the GitHub Pages site, so every
#                              change pushed to NXBNVNB shows up on the next launch without reinstalling (needs
#                              internet), but the sprites (assets/sprites) are inside the app
#   NinjaLegends-unsigned.ipa  the full offline app with all the game files inside (about 1.5 GB)
# NXBNVNB itself is only read, never changed. Sign and install with your sideloading tool.
# Runs on every push to this repo's main branch, or by hand: Actions tab -> Build iOS IPA -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: NXBNVNB branch, tag or commit to build
        default: main

permissions:
  contents: write          # to publish the IPAs as the 'latest' release

env:
  LIVE_ORIGIN: https://pomu1144.github.io
  LIVE_PATH: NXBNVNB/

jobs:
  ipa:
    runs-on: macos-15            # Xcode 16 (Capacitor 8 needs 16+)
    timeout-minutes: 90
    strategy:
      matrix:
        variant: [live, lite, debug, full]
    steps:
      - name: Checkout the game (NXBNVNB)
        uses: actions/checkout@v4
        with:
          repository: Pomu1144/NXBNVNB
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Checkout rxq (build patches)
        uses: actions/checkout@v4
        with:
          path: rxq-patch-repo

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        working-directory: app
        run: npm ci

      - name: Full app - copy the web game into the app
        if: matrix.variant == 'full'
        working-directory: app
        run: npm run sync

      - name: Live app - load the game from the website, but keep the sprites inside the app
        if: matrix.variant != 'full'
        working-directory: app
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # Bare domain as the server (Capacitor then allows that origin to read the app's own files) and the
          # game's folder as the start path.
          node -e '
            const fs = require("fs"); const p = "capacitor.config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.server = Object.assign({}, c.server, { url: process.env.LIVE_ORIGIN, appStartPath: process.env.LIVE_PATH, cleartext: false });
            fs.writeFileSync(p, JSON.stringify(c, null, 2));'
          rm -rf www && mkdir -p www/assets
          if [ "$VARIANT" = live ]; then
            cp -R ../assets/sprites www/assets/sprites
            echo '{"ok":true}' > www/assets/sprites/rxq-probe.json
          fi
          printf '<!doctype html><meta charset="utf-8"><body style="background:#101418"></body>' > www/index.html
          # Capacitor stops the app (fatalLoadError) unless the start path also exists inside the app, so give it
          # an empty placeholder folder: the real page still comes from the website.
          mkdir -p "www/$LIVE_PATH" && cp www/index.html "www/$LIVE_PATH/index.html"
          du -sh www
          npx cap sync ios
          cat capacitor.config.json

      - name: Add rxq's page scripts and style fixes to the app (see patch/ in rxq)
        working-directory: app
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # css/teams-compact.css: the phone layout of the Team Formation page (all builds, until NXBNVNB has it)
          # js/sprites-local.js:   live build only, loads sprites from the app's own copy
          # js/diag.js:            debug build only, the on-screen page log
          FILES="css/teams-compact.css"
          [ "$VARIANT" = live ] && FILES="js/sprites-local.js $FILES"
          [ "$VARIANT" = debug ] && FILES="js/diag.js $FILES"
          python3 "$GITHUB_WORKSPACE/rxq-patch-repo/patch/inject.py" ios/App/App/GameViewController.swift $FILES

      - name: Fix for Capacitor 8 (drop an override it no longer allows)
        working-directory: app/ios/App/App
        run: |
          # CAPBridgeViewController.prefersHomeIndicatorAutoHidden is not open in Capacitor 8, so overriding it
          # fails to compile ("overriding non-open property outside of its defining module"). Without it the
          # home indicator just stays visible. Only this build's copy changes; NXBNVNB is untouched.
          sed -i '' '/override var prefersHomeIndicatorAutoHidden/d' GameViewController.swift
          grep -n "override var" GameViewController.swift

      - name: Build (no code signing)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -target App -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package the IPA
        run: |
          NAME=${{ matrix.variant == 'live' && 'NinjaLegends-live' || matrix.variant == 'lite' && 'NinjaLegends-lite' || matrix.variant == 'debug' && 'NinjaLegends-debug' || 'NinjaLegends-unsigned' }}
          test -x app/ios/App/build/Release-iphoneos/App.app/App || { echo "no app binary: the build did not finish"; exit 1; }
          mkdir -p out/Payload
          cp -R app/ios/App/build/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry ../$NAME.ipa Payload
          ls -lh ../$NAME.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.variant }}
          path: '*.ipa'
          compression-level: 0

  release:
    needs: ipa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipa-*
          merge-multiple: true
      - name: Publish both as the "latest" release (direct download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh *.ipa
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest *.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Ninja Legends (unsigned IPAs)" \
            --notes "Built from Pomu1144/NXBNVNB.
          Lite (a few MB, everything incl. sprites from the website): https://github.com/$GITHUB_REPOSITORY/releases/latest/download/NinjaLegends-lite.ipa
          Debug (Lite plus an on-screen log, for finding bugs): https://github.com/$GITHUB_REPOSITORY/releases/latest/download/NinjaLegends-debug.ipa
          Live (sprites inside, loads the game from the website, updates itself): https://github.com/$GITHUB_REPOSITORY/releases/latest/download/NinjaLegends-live.ipa
          Full offline (about 1.5 GB): https://github.com/$GITHUB_REPOSITORY/releases/latest/download/NinjaLegends-unsigned.ipa"
